{% assign repo =
   site.data.repos
   | where: "name", include.repo
   | first
%}

<tr>

  <td>
    <a href="{{ repo.url }}">
      {{ repo.name }}
    </a>
  </td>

  <td>
    {{ repo.description }}
  </td>

  <td>

    <img
      alt="version"
      src="https://img.shields.io/github/v/tag/gundestrup/{{ repo.name }}?sort=semver">

    <img
      alt="updated"
      src="https://img.shields.io/github/last-commit/gundestrup/{{ repo.name }}">

  </td>

</tr>
