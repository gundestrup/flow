{% assign entry = site.data.repos | where: "name", include.repo | first %}

<tr>

  <td>
    <a href="{{ entry.url }}">
      {{ entry.name }}
    </a>
  </td>

  <td>
    {{ entry.description }}
  </td>

  <td>

    <img
      alt="version"
      src="https://img.shields.io/github/v/tag/gundestrup/{{ entry.name }}?sort=semver">

    <img
      alt="updated"
      src="https://img.shields.io/github/last-commit/gundestrup/{{ entry.name }}">

  </td>

</tr>
